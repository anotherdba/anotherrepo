name: 06-contexts
on:
  workflow_dispatch:

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Show the trigger
        run: echo "This workflow was triggered by the ${{ github.event_name }} event."
      - name: show Ref
        run: 'echo "Ref: ${{ github.ref }}"'
      - name: show SHA
        run: 'echo "SHA: ${{ github.sha }}"'
      - name: show Actor
        run: 'echo "Actor: ${{ github.actor }}"'
      - name: show Workflow
        run: 'echo "Workflow: ${{ github.workflow }}"'
      - name: show Run ID
        run: 'echo "Run ID: ${{ github.run_id }}"'
      - name: show Run number
        run: 'echo "Run number: ${{ github.run_number }}"'
