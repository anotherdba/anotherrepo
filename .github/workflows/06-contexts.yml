name: 07-Using Expressions
on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false
run-name: 07 - Using Expressions | DEBUG - ${{ inputs.debug }}
env:
  MY_WORKFLOW_VAR: "workflow"
  MY_OVERWRITTEN_VAR: "workflow"

jobs:
  echo-data:
    runs-on: ubuntu-latest
    env:
      MY_JOB_VAR: "job"
      MY_OVERWRITTEN_VAR: "job"
    steps:
      - name: [debug] print start-up data
        if : ${{ inputs.debug == 'true' }}
        run: |
          echo "This workflow was triggered by the ${{ github.event_name }} event."
          echo "Branch: ${{ github.ref }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: [debug] print when triggered from main branch
        run: |
          echo "The name of the variable is ${{ vars.my_var }}"
      - name: Print Env variables
        run: |
          echo "MY_WORKFLOW_VAR: $MY_WORKFLOW_VAR"
          echo "MY_JOB_VAR: $MY_JOB_VAR"
          echo "MY_OVERWRITTEN_VAR: $MY_OVERWRITTEN_VAR"