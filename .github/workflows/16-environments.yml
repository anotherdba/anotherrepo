name: 16- working with environments
on:
  workflow_dispatch:




jobs:
  echo-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MY_ENV_VALUE: ${{ vars.MY_ENV_VALUE  || 'default-value' }}
    steps:    
      - name: Echo vars
        run: |
          echo "Env variable: ${{ env.MY_ENV_VALUE }}"
  e2e-test:
    runs-on: ubuntu-latest
    needs: echo-staging
    steps:
      - name: Run e2e tests
        run: echo "Running e2e tests in staging environment"

  echo-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      MY_ENV_VALUE: ${{ vars.MY_ENV_VALUE  || 'default-value' }}
    steps:    
      - name: Echo vars
        run: |
          echo "Env variable: ${{ env.MY_ENV_VALUE }}"