name: 02-workflow-events
on:
  push:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '* * * * *' # Runs every day at midnight UTC
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name : Show the trigger
        run: echo "This workflow was triggered by the ${{ github.event_name }} event."