name: 03-workflow-runners
on:
  workflow_dispatch:

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name : Show the trigger
        run: echo "This job is running on a ${{ runner.os }} runner."
  windows-echo:
    runs-on: windows-latest
    steps:
      - name : Show the trigger
        run: echo "This job is running on a ${{ runner.os }} runner."
  macos-echo:
    runs-on: macos-latest
    steps:
      - name : Show the trigger
        run: echo "This job is running on a ${{ runner.os }} runner."